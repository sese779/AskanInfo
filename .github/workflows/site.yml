name: Mise à jour du site

on:
  schedule:
    # GitHub ne garantit pas les horaires (il en saute quand ses serveurs sont
    # chargés) : deux créneaux par heure pour en avoir au moins un.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Une seule mise à jour à la fois : évite les conflits sur data/items.json
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # toujours la dernière version, même en cas de relance
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Synthèses, veille et enregistrement
        run: |
          git config user.name "askaninfo-bot"
          git config user.email "askaninfo-bot@users.noreply.github.com"
          for essai in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            bash scripts/integrer_syntheses.sh
            python scripts/fetch.py
            git add data/items.json
            # le dossier des archives n'existe qu'après le premier article archivé
            if [ -d data/archives ]; then git add data/archives; fi
            if ! git diff --cached --quiet; then
              git commit -q -m "Fil d'actualité : mise à jour automatique"
            fi
            if [ -z "$(git rev-list origin/main..HEAD)" ]; then
              echo "Aucune nouveauté."
              exit 0
            fi
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "Quelqu'un a modifié le dépôt en même temps, nouvel essai ($essai)…"
            sleep 5
          done
          exit 1

      # Les MP3 du podcast sont servis depuis askaninfo.com (même site, bon
      # format audio) : on récupère les épisodes récents depuis la release.
      - uses: actions/cache@v4
        with:
          path: cache-podcast
          key: podcast-${{ hashFiles('data/podcast/*.json') }}
          restore-keys: podcast-

      - name: Récupération des épisodes récents du podcast
        run: python scripts/podcast_local.py

      - name: Construction du site
        run: python scripts/build.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v5

      # Chaîne Telegram : ne fait rien tant que les secrets ne sont pas créés
      # (Settings → Secrets and variables → Actions : TELEGRAM_TOKEN, TELEGRAM_CANAL)
      - name: Publication sur Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: |
          python scripts/telegram.py
          if [ -f data/telegram.txt ] && [ -n "$(git status --porcelain data/telegram.txt)" ]; then
            git add data/telegram.txt
            git commit -q -m "Telegram : contenus publiés"
            for essai in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi
