name: Podcast

# Après chaque mise à jour du site : si un nouveau script de revue de presse
# (content/podcast/*.md) ou une nouvelle synthèse est arrivé sur main, on fabrique
# les MP3 avec Piper (podcast et synthèses lues),
# on le range dans la release « podcast », puis on relance la mise à jour du
# site pour publier l'épisode. S'exécute toujours depuis main.

on:
  workflow_run:
    workflows: ["Mise à jour du site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: site
  cancel-in-progress: false

env:
  VOIX: fr_FR-siwis-medium
  VOIX_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Y a-t-il un nouvel épisode ?
        id: verif
        run: |
          nouveau=non
          for f in content/podcast/[!_]*.md; do
            [ -e "$f" ] || continue
            nom=$(basename "$f" .md)
            [ -e "data/podcast/$nom.json" ] || nouveau=oui
          done
          for f in content/syntheses/[!_]*.md; do
            [ -e "$f" ] || continue
            nom=$(basename "$f" .md)
            [ -e "data/audio/$nom.json" ] || nouveau=oui
          done
          for f in content/video/[!_]*.md; do
            [ -e "$f" ] || continue
            nom=$(basename "$f" .md)
            [ -e "data/video/$nom.json" ] || nouveau=oui
          done
          wolof=non
          for f in content/video/[!_]*-wolof.md; do
            [ -e "$f" ] || continue
            [ -e "data/video/$(basename "$f" .md).json" ] || wolof=oui
          done
          echo "nouveau=$nouveau" >> "$GITHUB_OUTPUT"
          echo "wolof=$wolof" >> "$GITHUB_OUTPUT"
          echo "Nouvel épisode : $nouveau"

      - uses: actions/setup-python@v6
        if: steps.verif.outputs.nouveau == 'oui'
        with:
          python-version: "3.12"

      - name: Installer Piper et ffmpeg
        if: steps.verif.outputs.nouveau == 'oui'
        run: |
          pip install -q piper-tts==1.8.0 PyYAML==6.0.3 Pillow==12.3.0
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - uses: actions/cache@v4
        if: steps.verif.outputs.nouveau == 'oui'
        with:
          path: voix
          key: voix-${{ env.VOIX }}

      - name: Télécharger la voix française
        if: steps.verif.outputs.nouveau == 'oui'
        run: |
          mkdir -p voix
          [ -s "voix/$VOIX.onnx" ] || curl -sSfL -o "voix/$VOIX.onnx" "$VOIX_URL/$VOIX.onnx"
          [ -s "voix/$VOIX.onnx.json" ] || curl -sSfL -o "voix/$VOIX.onnx.json" "$VOIX_URL/$VOIX.onnx.json"

      # Voix wolof (vidéo wolof du soir) : installée seulement si une vidéo wolof est à faire.
      # En cas d'échec, le reste continue ; la vidéo wolof sera retentée au passage suivant.
      - uses: actions/cache@v4
        if: steps.verif.outputs.wolof == 'oui'
        with:
          path: ~/.cache/huggingface
          key: voix-wolof-speecht5-v02

      - name: Installer la voix wolof
        if: steps.verif.outputs.wolof == 'oui'
        continue-on-error: true
        run: |
          pip install -q torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==4.46.1 sentencepiece==0.2.3 soundfile==0.14.0 protobuf==7.36.2

      - name: Fabriquer et publier l'épisode
        if: steps.verif.outputs.nouveau == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/podcast.py "voix/$VOIX.onnx"
          python scripts/audio_articles.py "voix/$VOIX.onnx"
          python scripts/video_jour.py "voix/$VOIX.onnx" --lot
          git config user.name "askaninfo-bot"
          git config user.email "askaninfo-bot@users.noreply.github.com"
          mkdir -p data/podcast data/audio data/video
          git add data/podcast data/audio data/video
          git diff --cached --quiet && exit 0
          git commit -q -m "Audio et vidéo : podcast, synthèses lues, vidéo du jour"
          for essai in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          gh workflow run site.yml --ref main
