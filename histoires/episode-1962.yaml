titre: "Décembre 1962 : la crise qui a changé le Sénégal"
sources:
  - "Jeune Afrique, « Mamadou Dia »"
  - "Enquête Plus et Le Quotidien, « Mamadou Dia : retour sur la crise de décembre 1962 »"
  - "Encyclopædia Universalis, « Dia Mamadou (1910-2009) »"
  - "Dakaractu, « Relations entre Mamadou Dia et Senghor »"
plans:
  - grand: "Décembre 1962. Le chef du gouvernement du Sénégal est arrêté."
    voix: "Décembre 1962. Le chef du gouvernement du Sénégal est arrêté. Voici comment on en est arrivé là."
    photo: 1962-carrefour
    sans_sous_titres: true
  - haut: "Dakar, 4 avril 1962"
    voix: "Nous sommes en 1962. Le Sénégal est indépendant depuis deux ans. Léopold Sédar Senghor est président de la République. Mamadou Dia dirige le gouvernement, comme président du Conseil."
    photo: 1962-senghor
  - voix: "Entre les deux hommes, la rupture s'installe. Le 14 décembre, une quarantaine de députés déposent une motion de censure contre le gouvernement de Mamadou Dia."
    photo: 1962-universite
  - haut: "L'Assemblée nationale, aujourd'hui"
    voix: "Le 17 décembre, Mamadou Dia fait évacuer l'Assemblée nationale par les forces de l'ordre. Les députés votent quand même la motion, le soir, au domicile de l'un d'eux."
    photo: assemblee
  - date: "18 déc. 1962"
    voix: "Le lendemain, Mamadou Dia est arrêté, avec plusieurs de ses ministres. Le pouvoir parle de tentative de coup d'État."
  - date: "Mai 1963"
    voix: "En mai 1963, la Haute Cour de justice le condamne à la détention à perpétuité. Il est enfermé à Kédougou. Ses ministres Valdiodio Ndiaye, Ibrahima Sarr et Joseph Mbaye sont condamnés à vingt ans."
  - voix: "La même année, une nouvelle Constitution supprime le poste de chef du gouvernement. Le Sénégal passe à un régime présidentiel."
    photo: 1962-senghor
  - date: "1974 · 1976"
    voix: "Mamadou Dia est libéré en 1974, après plus de onze ans de détention, puis amnistié en 1976. Il meurt à Dakar en 2009."
  - voix: "Coup d'État, ou piège politique ? Plus de soixante ans après, le débat n'est pas clos."
    photo: 1962-carrefour
  - grand: "Abonnez-vous pour la prochaine histoire"
    voix: "C'était Askan Histoires. Abonnez-vous pour ne pas manquer la prochaine histoire."
    sans_sous_titres: true
