titre: "Thiaroye (3/3) : la longue bataille de la mémoire"
serie: "Thiaroye 1944"
partie: 3
sources:
  - "Wikipédia, « Massacre de Thiaroye »"
  - "Associated Press, via ABC News et Africanews : Macron qualifie Thiaroye de « massacre » (28 novembre 2024)"
  - "Euronews et AllAfrica : commémoration du 80e anniversaire (1er décembre 2024)"
  - "AFP, via Al Jazeera et Le360 : rapport officiel sénégalais (octobre 2025)"
