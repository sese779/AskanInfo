# Règles de classement de la veille (mots-clés Sénégal, rubriques).
# La liste des médias suivis est dans medias.yaml.

# Mots-clés utilisés quand « filtre: true »
mots_cles_senegal:
  - sénégal
  - senegal
  - sénégalais
  - senegalais
  - dakar
  - thiès
  - saint-louis
  - ziguinchor
  - casamance
  - touba
  - kaolack
  - sonko
  - diomaye
  - faye
  - lions de la teranga
  - teranga

# Rubriques, attribuées automatiquement par mots-clés. Ordre de décision :
# 1. Sport, Diaspora (y compris un titre « Sénégalais / Sénégalaise » + pays étranger,
#    et tout article d'un média marqué « diaspora: true » dans medias.yaml) ; 2. si l'article ne parle pas du Sénégal : Afrique, puis
# Monde (d'après le titre) ; 3. les autres thèmes, dans l'ordre ci-dessous. Le titre compte avant l'extrait. Un mot de 5 lettres ou plus reconnaît aussi les mots qui
# commencent pareil (« lioncel » → « Lioncelles »).
