# Sources suivies par la veille automatique.
# - flux : adresse du flux RSS officiel publié par le média
# - filtre : true = ne garder que les articles qui parlent du Sénégal
# - zone : Afrique ou Monde = les articles de cette source qui ne parlent pas
#          du Sénégal vont dans cet onglet (l'onglet Afrique est aussi choisi
#          quand le titre cite un pays africain)
# Pour ajouter une source : copier un bloc et changer les valeurs.
# Pour en retirer une : supprimer le bloc ou mettre « actif: false ».

sources:
  - nom: APS
