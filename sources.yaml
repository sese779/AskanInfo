  - teranga

# Rubriques, attribuées automatiquement par mots-clés. Ordre de décision :
# 1. Sport, Diaspora ; 2. si l'article ne parle pas du Sénégal : Afrique, puis
# Monde (d'après le titre) ; 3. les autres thèmes, dans l'ordre ci-dessous. Le titre compte avant l'extrait. Un mot de 5 lettres ou plus reconnaît aussi les mots qui
# commencent pareil (« lioncel » → « Lioncelles »).
rubriques:
  Sport: [sport, football, foot, ligue, match, lions, lionceau, lioncel, coupe du monde, can, joj, jo, olympique, médaille, champion, basket, futsal, lutte, athlétisme, taekwondo, gymnastique, équitation, natation, judo, handball, fifa, caf, fsf, psg, real madrid, barça, manchester, tottenham, chelsea, arsenal, liverpool, mané, sélectionneur, entraîneur, forfait, mma, tennis]
  Diaspora: [diaspora, émigration, immigration, émigré, migrant, migration, pirogue, sénégalais de l'extérieur, sénégalais en, sénégalais d'italie, sénégalais de france, rapatri]
