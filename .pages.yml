# Configuration de l'interface d'administration Pages CMS (https://pagescms.org)
# Connexion : https://app.pagescms.org avec le compte GitHub.

media:
  input: static/images
  output: /static/images

content:
  - name: articles
    label: Mes articles
    type: collection
    path: content/articles
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [titre, date, rubrique, brouillon]
      primary: titre
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: chapo
        label: Chapô (une phrase d'introduction)
        type: text
      - name: date
        label: Date de publication
        type: date
        required: true
        options:
          time: true
      - name: rubrique
        label: Rubrique
        type: select
        default: Actualité
        options:
          values: [Politique, Société, Faits divers, Sport, Diaspora, Économie, Culture, Afrique, Monde, Actualité]
      - name: auteur
        label: Signature
        type: string
        default: Rédaction
      - name: brouillon
        label: Brouillon (non publié)
        type: boolean
        default: true
      - name: body
        label: Texte de l'article
        type: rich-text

  - name: syntheses
    label: Synthèses (agent)
    type: collection
    path: content/syntheses
    view:
      fields: [titre, date, rubrique]
      primary: titre
      default:
        sort: date
        order: desc
    fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: chapo
        label: Chapô
        type: text
      - name: date
        label: Date
        type: date
        options:
          time: true
      - name: rubrique
        label: Rubrique
        type: select
        options:
          values: [Politique, Société, Faits divers, Sport, Diaspora, Économie, Culture, Afrique, Monde, Actualité]
      - name: sources
        label: Sources
        type: object
        list: true
        fields:
          - name: nom
            label: Média
            type: string
          - name: titre
            label: Titre de l'article
            type: string
          - name: url
            label: Lien
            type: string
      - name: body
        label: Texte
        type: text

  - name: medias
    label: Médias suivis
    type: file
    path: medias.yaml
    fields:
      - name: sources
        label: Médias
        type: object
        list: true
        fields:
          - name: nom
            label: Nom du média
            type: string
            required: true
          - name: site
            label: Adresse du site
            type: string
          - name: flux
            label: Adresse du flux RSS
            type: string
            required: true
          - name: format
            label: "Format (vide = flux RSS ; plan-actualites = plan de site Google Actualités)"
            type: string
          - name: filtre
            label: Ne garder que les articles sur le Sénégal
            type: boolean
          - name: zone
            label: Onglet pour ses articles hors Sénégal (Afrique ou Monde, sinon vide)
            type: string
          - name: diaspora
            label: Média de la diaspora (ses articles vont dans l'onglet Diaspora)
            type: boolean
          - name: secondaire
            label: "Source secondaire (dans le fil, mais ne compte ni pour la une ni pour les synthèses)"
            type: boolean
          - name: actif
            label: Actif
            type: boolean
            default: true

  - name: reglages
    label: Réglages
    type: file
    path: reglages.yaml
    fields:
      - name: slogan_fort
        label: Slogan – partie en gras et en vert
        type: string
      - name: slogan_suite
        label: Slogan – suite
        type: string
      - name: contact
        label: E-mail de contact
        type: string
      - name: goatcounter
        label: Code GoatCounter (statistiques ; vide = désactivé)
        type: string
      - name: facebook
        label: Page Facebook – nom d'utilisateur (ex. askaninfo)
        type: string
      - name: whatsapp
        label: Chaîne WhatsApp – adresse complète (https://whatsapp.com/channel/…)
        type: string
      - name: telegram
        label: Chaîne Telegram – nom sans @ (ex. askaninfo)
        type: string

  - name: images
    label: "Images par sujet"
    type: file
    path: images.yaml
    fields:
      - name: images
        label: "Images (affichées quand le titre contient un des mots-clés ; uniquement des images libres ou autorisées)"
        type: object
        list: true
        fields:
          - name: mots_cles
            label: "Mots-clés (ex. JOJ, Lions, Assemblée nationale)"
            type: string
            list: true
            required: true
          - name: image
            label: "Image"
            type: image
            required: true
          - name: type
            label: "Type"
            type: select
            default: photo
            options:
              values: [photo, logo]
          - name: credit
            label: "Crédit (obligatoire, ex. « Logo : COJOJ Dakar 2026 » ou « Photo : auteur, licence »)"
            type: string
            required: true
          - name: source
            label: "Page d'origine de l'image (lien)"
            type: string
          - name: actif
            label: "Actif"
            type: boolean
            default: true

  - name: joueurs
    label: "Sport : joueurs et clubs"
    type: file
    path: joueurs.yaml
    fields:
      - name: joueurs
        label: "Joueurs sénégalais suivis (prénom et nom)"
        type: string
        list: true
      - name: clubs_senegal
        label: "Clubs, compétitions et lutteurs du Sénégal"
        type: string
        list: true
      - name: competitions
        label: "Championnats étrangers (servent seulement à ranger en Sport)"
        type: string
        list: true

  - name: redaction
    label: "Rédaction (agent)"
    type: file
    path: redaction.yaml
    fields:
      - name: heures_passage
        label: "Heures de passage de l'agent, heure de Dakar (1 à 3, ex. 8h47). Appliquées au passage suivant"
        type: string
        list: true
      - name: syntheses_par_passage
        label: "Nombre maximum de synthèses par passage (1 à 8)"
        type: number
        default: 5
      - name: sources_minimum
        label: "Sources principales exigées par sujet (2 à 4)"
        type: number
        default: 2
      - name: mots_minimum
        label: "Longueur minimale d'une synthèse, en mots (80 à 200)"
        type: number
        default: 120
      - name: mots_maximum
        label: "Longueur maximale d'une synthèse, en mots (150 à 400)"
        type: number
        default: 250
      - name: rubriques_prioritaires
        label: "Rubriques à privilégier à importance égale"
        type: select
        options:
          multiple: true
          values: [Politique, Société, Faits divers, Sport, Diaspora, Économie, Culture, Afrique, Monde, Actualité]
      - name: sujets_a_eviter
        label: "Mots-clés de sujets à ne pas traiter"
        type: string
        list: true
      - name: sujet_diaspora_quotidien
        label: "Un sujet « Sénégalais à l'étranger » par jour quand il existe"
        type: boolean
        default: true
      - name: senegalais_du_week_end
        label: "Synthèse du lundi « Les Sénégalais du week-end »"
        type: boolean
        default: true
      - name: joueurs_minimum
        label: "Joueurs concernés pour l'écrire (2 à 6)"
        type: number
        default: 3
      - name: podcast
        label: "Revue de presse audio du soir"
        type: boolean
        default: true
      - name: podcast_mots_minimum
        label: "Longueur minimale du podcast, en mots (300 à 600)"
        type: number
        default: 400
      - name: podcast_mots_maximum
        label: "Longueur maximale du podcast, en mots (500 à 1000)"
        type: number
        default: 700

  - name: masquer
    label: "Liens masqués"
    type: file
    path: masquer.yaml
    fields:
      - name: liens
        label: "Adresses d'articles à retirer du site (une par ligne)"
        type: string
        list: true
