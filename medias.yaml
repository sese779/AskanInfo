    filtre: false
    actif: true
    zone: Afrique

  - nom: Le Monde Afrique
    site: https://www.lemonde.fr/afrique/
    flux: https://www.lemonde.fr/afrique/rss_full.xml
    filtre: false
    actif: true
    zone: Afrique

  # --- Afrique (articles hors Sénégal → onglet Afrique) ---
  - nom: Africanews
    site: https://fr.africanews.com
    flux: https://fr.africanews.com/feed/rss
    filtre: false
    actif: true
    zone: Afrique

  - nom: APA News
    site: https://apanews.net
    flux: https://apanews.net/feed/
    filtre: false
    zone: Afrique
    actif: false   # accès refusé (403) : à réactiver seulement avec leur accord

  # --- Monde (articles hors Sénégal → onglet Monde) ---
  - nom: Le Monde International
